# Tool configuration only: the historical src.* imports are intentionally retained.
# Do not run pip install -e .; this repository is not a packaging migration.
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
[tool.pytest.ini_options]
testpaths = ["tests"]
